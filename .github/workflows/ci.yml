name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # This repository is public and the capacity router is a reusable workflow
    # in the private .github-private, which a public caller cannot resolve.
    # Target the ultra pool directly until the router is published somewhere a
    # public repository can reach.
    runs-on: [self-hosted, linux, x64, universe, gcp, universe-gcp-medium]
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: bitcoinuniverseio/universe-ci-actions/universe-node-env@8e24bc760556caa5ec8c7c497baaad2e9adcc912
      - name: Specification byte contract
        run: npm run spec:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify vectors
        run: node cli.mjs vectors verify

      - name: Vectors are reproducible
        run: |
          npm run vectors:generate
          git diff --exit-code -- vectors examples

      - name: Check the public site
        run: node site/tools/verify.mjs

      - name: Check the documentation
        run: node docs/tools/verify.mjs

      # The cards, the sharing metadata and the search index are generated from
      # files in this repository. If regenerating them changes anything, someone
      # edited the output instead of the input.
      - name: The generated pages are reproducible
        run: |
          node site/tools/build-cards.mjs
          node docs/tools/stamp-meta.mjs
          node docs/tools/build-search-index.mjs
          git diff --exit-code -- site docs

      - name: Package contents
        run: npm pack --dry-run

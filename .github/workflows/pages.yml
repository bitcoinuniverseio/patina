name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Existing commit, tag, or branch to redeploy
        required: true
        default: main
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: production-${{ github.repository }}
  cancel-in-progress: true

jobs:
  build:
    # This repository is public and the capacity router is a reusable workflow
    # in the private .github-private, which a public caller cannot resolve.
    # Target the ultra pool directly until the router is published somewhere a
    # public repository can reach.
    runs-on: [self-hosted, linux-ultra]
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the exact requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0

      - name: Pin npm
        run: npm install --global npm@11.17.0

      - name: Check the site
        run: node site/tools/verify.mjs

      - name: Check the documentation
        run: node docs/tools/verify.mjs

      # The cards, the sharing metadata and the search index are all generated
      # from files in this repository. If regenerating them changes anything,
      # somebody edited the output instead of the input.
      - name: The generated files are reproducible
        run: |
          node site/tools/build-cards.mjs
          node docs/tools/stamp-meta.mjs
          node docs/tools/build-search-index.mjs
          git diff --exit-code -- site docs

      - name: Assemble the published tree
        run: |
          $public = Join-Path $env:GITHUB_WORKSPACE 'public'
          $publicDocs = Join-Path $public 'docs'
          $publicVectors = Join-Path $public 'vectors'
          New-Item -ItemType Directory -Path $public, $publicDocs, $publicVectors -Force | Out-Null
          Get-ChildItem -LiteralPath 'site' -Force | Copy-Item -Destination $public -Recurse -Force
          Get-ChildItem -LiteralPath 'docs' -Force | Copy-Item -Destination $publicDocs -Recurse -Force
          Copy-Item -LiteralPath 'patina-protocol.md' -Destination (Join-Path $public 'patina-protocol.md')
          Copy-Item -LiteralPath 'vectors/golden.json', 'vectors/manifest.json' -Destination $publicVectors
          New-Item -ItemType File -Path (Join-Path $public '.nojekyll') -Force | Out-Null

      - name: Record the immutable deployment revision
        run: git rev-parse HEAD

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: [self-hosted, linux-ultra]
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
